<script>
const SUPABASE_URL = "https://asrdxwjadkpbuhqnvkns.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_9SOmkyilZY-2uttPPvx6LQ_LyNccwne";
const EMAIL_AUTORIZADO = "eliezer1789j@gmail.com";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let usuarioAutenticado = null;
let sincronizacaoPendente = null;
let progressoLocalPendente = {};

let contador = 0;
let indiceDiaOriginal = 0;
const diaOriginalPorCheckbox = [];
const totalDiasOriginais = 365;

// Divide uma leitura diária em capítulos individuais, preservando livros e intervalos.
function expandirLeitura(leitura) {
  const capitulos = [];
  leitura.split("/").forEach(parte => {
    const texto = parte.trim();
    const correspondencia = texto.match(/^(.*?)\s+(\d+)(?:\s*[–-]\s*(\d+))?$/);
    if (correspondencia) {
      const livro = correspondencia[1].trim();
      const inicio = Number(correspondencia[2]);
      const fim = correspondencia[3] ? Number(correspondencia[3]) : inicio;
      for (let capitulo = inicio; capitulo <= fim; capitulo++) {
        capitulos.push(livro + " " + capitulo);
      }
    } else {
      // Livros de capítulo único, como Obadias, Filemom, 2 João, 3 João e Judas.
      capitulos.push(texto);
    }
  });
  return capitulos;
}

// Converte marcações antigas (uma por dia) em marcações por capítulo.
function migrarProgressoDiario(progressoAntigo) {
  const novo = { schemaVersion: 2 };
  for (let i = 0; i < contador; i++) {
    const dia = diaOriginalPorCheckbox[i];
    novo["chk_" + i] = progressoAntigo["chk_" + dia] === true;
  }
  for (let i = 0; i < contador; i++) {
    if (progressoAntigo["chk_" + diaOriginalPorCheckbox[i]] === true) {
      novo["chk_" + i] = true;
    }
  }
  return novo;
}

// function to hover on each line
document.addEventListener("mouseover", function(e){
  if(e.target.tagName === "TD"){
    let tr = e.target.parentElement;
    Array.from(tr.children).forEach(td => {
      td.style.backgroundColor = "#ffffcc";
    });
  }
});

// function to remove hover effect
document.addEventListener("mouseout", function(e){
  if(e.target.tagName === "TD"){
    let tr = e.target.parentElement;
    Array.from(tr.children).forEach(td => {
      td.style.backgroundColor = "";
    });
  }
});

// Cria a tabela para cada mês
function tabela(mes, dados){
  document.write('<details class="mes-leitura"><summary>'+mes+'</summary>');
  document.write("<table><tr><th>Dia</th><th>Leitura</th><th>Lido</th></tr>");

  dados.forEach((leituraDiaria, indiceDoMes) => {
    const diaDoPlano = indiceDiaOriginal++;
    expandirLeitura(leituraDiaria).forEach(capitulo => {
      const id = "chk_" + contador++;
      diaOriginalPorCheckbox.push(diaDoPlano);
      document.write(`
        <tr>
          <td>${indiceDoMes + 1}</td>
          <td>${capitulo}</td>
          <td><input type="checkbox" id="${id}" onchange="salvar('${id}')"></td>
        </tr>
      `);
    });
  });

  document.write("</table></details>");
}

function definirStatus(mensagem) {
  const status = document.getElementById("authStatus");
  if (status) status.textContent = mensagem;
}

function definirMarcacoesAtivas(ativo) {
  for (let i = 0; i < contador; i++) {
    const checkbox = document.getElementById("chk_" + i);
    if (checkbox) checkbox.disabled = !ativo;
  }
  document.getElementById("loginButton").style.display = ativo ? "none" : "inline-block";
  document.getElementById("passwordInput").style.display = ativo ? "none" : "inline-block";
  document.getElementById("logoutButton").style.display = ativo ? "inline-block" : "none";
}

function lerProgressoAtual() {
  const progresso = {};
  for (let i = 0; i < contador; i++) {
    const id = "chk_" + i;
    progresso[id] = document.getElementById(id).checked;
  }
  return progresso;
}

function aplicarProgresso(progresso) {
  for (let i = 0; i < contador; i++) {
    const id = "chk_" + i;
    const marcado = progresso && progresso[id] === true;
    document.getElementById(id).checked = marcado;
    localStorage.setItem(id, String(marcado));
  }
  atualizarProgresso();
}

function carregarProgressoLocal() {
  progressoLocalPendente = {};
  for (let i = 0; i < contador; i++) {
    const id = "chk_" + i;
    const marcado = localStorage.getItem(id) === "true";
    progressoLocalPendente[id] = marcado;
    // Exibe o progresso salvo neste navegador mesmo antes do login.
    // As caixas continuam desativadas até a autenticação ser concluída.
    document.getElementById(id).checked = marcado;
  }
  atualizarProgresso();
}

// Leva a página ao primeiro capítulo ainda não concluído.
function irParaProximaLeitura() {
  let alvo = null;
  for (let i = 0; i < contador; i++) {
    const checkbox = document.getElementById("chk_" + i);
    if (checkbox && !checkbox.checked) {
      alvo = checkbox;
      break;
    }
  }

  // Se tudo estiver concluído, mostra a última leitura do plano.
  if (!alvo && contador > 0) {
    alvo = document.getElementById("chk_" + (contador - 1));
  }

  if (alvo) {
    // Abre o mês da próxima leitura antes de rolar.
    const mes = alvo.closest("details.mes-leitura");
    if (mes) mes.open = true;
    // Pequeno atraso para a tabela terminar de renderizar antes de rolar.
    setTimeout(() => {
      alvo.closest("tr").scrollIntoView({ behavior: "auto", block: "center" });
    }, 150);
  }
}

// Salva localmente e sincroniza com a nuvem após pequenas pausas.
function salvar(id) {
  if (!usuarioAutenticado) {
    document.getElementById(id).checked = false;
    definirStatus("Entre com seu e-mail e senha para alterar e sincronizar suas marcações.");
    return;
  }
  localStorage.setItem(id, String(document.getElementById(id).checked));
  atualizarProgresso();
  clearTimeout(sincronizacaoPendente);
  sincronizacaoPendente = setTimeout(salvarProgressoNaNuvem, 500);
}

async function salvarProgressoNaNuvem() {
  if (!usuarioAutenticado) return;
  const { error } = await supabaseClient
    .from("bible_reading_progress")
    .upsert({
      user_id: usuarioAutenticado.id,
      progress: { ...lerProgressoAtual(), schemaVersion: 2 },
      updated_at: new Date().toISOString()
    }, { onConflict: "user_id" });

  if (error) {
    definirStatus("Não foi possível sincronizar agora. Suas marcações continuam salvas neste dispositivo; tente novamente mais tarde.");
    console.error("Erro ao sincronizar progresso:", error.message);
  } else {
    definirStatus("Conectado como " + EMAIL_AUTORIZADO + ". Suas marcações estão sincronizadas.");
  }
}

async function entrarComSenha() {
  const senha = document.getElementById("passwordInput").value;
  if (!senha) {
    definirStatus("Digite sua senha para entrar.");
    return;
  }

  definirStatus("Verificando seus dados de acesso...");
  const { error } = await supabaseClient.auth.signInWithPassword({
    email: EMAIL_AUTORIZADO,
    password: senha
  });

  if (error) {
    definirStatus("Não foi possível entrar. Confira a senha e tente novamente.");
    console.error("Erro ao entrar:", error.message);
    return;
  }

  document.getElementById("passwordInput").value = "";
  await iniciarSincronizacao();
}

async function sairDaConta() {
  await supabaseClient.auth.signOut();
  usuarioAutenticado = null;
  definirMarcacoesAtivas(false);
  carregarProgressoLocal();
  definirStatus("Você saiu. Entre novamente para ver e sincronizar suas marcações.");
}

async function iniciarSincronizacao() {
  definirMarcacoesAtivas(false);
  carregarProgressoLocal();

  const { data, error } = await supabaseClient.auth.getSession();
  if (error || !data.session) {
    definirStatus("Entre com seu e-mail e senha para sincronizar suas marcações entre dispositivos.");
    irParaProximaLeitura();
    return;
  }

  const usuario = data.session.user;
  if ((usuario.email || "").toLowerCase() !== EMAIL_AUTORIZADO) {
    await supabaseClient.auth.signOut();
    definirStatus("Este plano permite sincronização apenas pela conta autorizada.");
    return;
  }

  usuarioAutenticado = usuario;
  definirStatus("Carregando suas marcações sincronizadas...");
  const { data: registro, error: erroLeitura } = await supabaseClient
    .from("bible_reading_progress")
    .select("progress")
    .eq("user_id", usuario.id)
    .maybeSingle();

  if (erroLeitura) {
    usuarioAutenticado = null;
    definirStatus("A tabela ainda não está pronta ou houve um erro de acesso. Execute supabase-setup.sql no SQL Editor do Supabase.");
    console.error("Erro ao carregar progresso:", erroLeitura.message);
    return;
  }

  let local = progressoLocalPendente;
  if (local.schemaVersion !== 2) {
    local = migrarProgressoDiario(local);
  }

  let progressoFinal;
  if (registro && registro.progress) {
    progressoFinal = registro.progress.schemaVersion === 2
      ? { ...registro.progress }
      : migrarProgressoDiario(registro.progress);
  } else {
    progressoFinal = { ...local };
  }

  aplicarProgresso(progressoFinal);
  definirMarcacoesAtivas(true);
  irParaProximaLeitura();
  await salvarProgressoNaNuvem();
}

// Função para atualizar o contador de progresso
function atualizarProgresso(){
  let total = contador;
  let concluidos = 0;
  for(let i=0;i<contador;i++){
    if(document.getElementById("chk_" + i).checked) concluidos++;
  }
  let perc = Math.round((concluidos / total) * 100);
  let barra = document.getElementById("progressoBar");
  barra.style.width = perc + "%";
  barra.innerText = perc + "%";
}
</script>
